services:
  web:
    build: .
    image: mediasnap
    container_name: mediasnap
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=
      # Chaves opcionais das APIs (yt-dlp ja cobre muitos sites sem chave)
      - YOUTUBE_API_KEY=
      - INSTAGRAM_API_KEY=
      - TIKTOK_API_KEY=
      - API_PUBLIC_URL=